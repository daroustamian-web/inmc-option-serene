<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Hyperbaric oxygen chamber illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF3EA"/>
      <stop offset="1" stop-color="#D9E4D2"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F2F4F1"/>
      <stop offset="1" stop-color="#C9D2C6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D4E8B0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D4E8B0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <ellipse cx="400" cy="400" rx="330" ry="26" fill="#2C3E35" opacity="0.12"/>
  <ellipse cx="400" cy="250" rx="300" ry="150" fill="url(#glow)"/>
  <!-- chamber body -->
  <rect x="110" y="170" width="560" height="200" rx="100" fill="url(#shell)" stroke="#2C3E35" stroke-opacity="0.25" stroke-width="3"/>
  <!-- ribs -->
  <g stroke="#2C3E35" stroke-opacity="0.18" stroke-width="6">
    <line x1="260" y1="172" x2="260" y2="368"/>
    <line x1="400" y1="172" x2="400" y2="368"/>
    <line x1="540" y1="172" x2="540" y2="368"/>
  </g>
  <!-- window -->
  <rect x="290" y="215" width="220" height="70" rx="35" fill="#2C3E35" opacity="0.85"/>
  <rect x="300" y="222" width="90" height="12" rx="6" fill="#FFFFFF" opacity="0.25"/>
  <!-- door end -->
  <circle cx="660" cy="270" r="72" fill="#F7F8F5" stroke="#2C3E35" stroke-opacity="0.3" stroke-width="4"/>
  <circle cx="660" cy="270" r="44" fill="none" stroke="#2C3E35" stroke-opacity="0.35" stroke-width="4"/>
  <circle cx="660" cy="270" r="8" fill="#2C3E35" opacity="0.6"/>
  <!-- legs -->
  <g fill="#2C3E35" opacity="0.55">
    <rect x="190" y="362" width="18" height="38" rx="4"/>
    <rect x="580" y="362" width="18" height="38" rx="4"/>
  </g>
  <!-- oxygen bubbles -->
  <g fill="#FFFFFF" stroke="#2C3E35" stroke-opacity="0.35" stroke-width="2">
    <circle cx="150" cy="120" r="16"/>
    <circle cx="190" cy="80" r="9"/>
    <circle cx="640" cy="110" r="12"/>
    <circle cx="690" cy="70" r="20"/>
  </g>
  <text x="150" y="126" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C3E35" text-anchor="middle">O₂</text>
  <text x="690" y="77" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#2C3E35" text-anchor="middle">O₂</text>
</svg>
